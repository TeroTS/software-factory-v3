openapi: 3.1.0
info:
  title: Software factory PoC webhook, lifecycle, and worker interfaces
  version: 0.2.0
  description: Signed GitHub issue receipt, MicroVM lifecycle hooks, and job status API.
servers:
  - url: https://{endpoint}
    description: AWS-managed endpoint returned at launch.
    variables:
      endpoint:
        default: microvm-endpoint.example.invalid
paths:
  /:
    servers:
      - url: https://{functionUrlHost}
        description: Public Lambda Function URL for GitHub deliveries; distinct from the MicroVM worker.
        variables:
          functionUrlHost:
            default: receiver.lambda-url.us-east-1.example.invalid
    post:
      operationId: receiveIssue
      summary: Request a pinned Job from a signed issue-opening delivery
      description: 'Accept only issues/opened in the deployment-authorized repository, excluding PRs. Verify HMAC-SHA256 over the original HTTP body bytes (not reserialized JSON). Capture title and body, separated by two newlines when the body is nonempty; a null/empty body yields title only. Resolve the deployment-owned target branch to a full SHA with the existing scoped GitHub token, then conditionally store the existing Job schema in DynamoDB as PENDING. Payload fields cannot select credentials or target configuration. Duplicate delivery may request duplicate/concurrent billable Jobs; receipt is not completion.'
      security:
        - GitHubSignature: []
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
          description: Only issues requests work; other signed events are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, repository, issue]
              properties:
                action:
                  type: string
                  description: Only opened requests work.
                repository:
                  type: object
                  required: [full_name]
                  properties:
                    full_name:
                      type: string
                      description: Must exactly match deployment-owned repository authorization.
                issue:
                  type: object
                  required: [title]
                  properties:
                    title:
                      type: string
                      minLength: 1
                    body:
                      type: [string, 'null']
                    pull_request:
                      description: Presence excludes this delivery from Job submission.
              description: Additional GitHub fields are ignored; comments and later edits are not fetched. Prepared Job JSON must fit the existing 16 KiB worker limit.
      responses:
        '202':
          description: Prepared Job accepted by DynamoDB; not workflow startup, publication, or VM termination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookReply'
              example: {message: Job queued}
        '200':
          description: Signed but irrelevant event, action, or PR ignored; no Job queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookReply'
        '400':
          description: Malformed issue/body/task or oversized Job; no Job queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookReply'
        '403':
          description: Missing/invalid/tampered signature or unauthorized repository; no Job queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookReply'
        '405':
          description: POST required; no Job queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookReply'
        '500':
          description: Deployment configuration unavailable; no Job queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookReply'
        '502':
          description: GitHub/token/baseline resolution or DynamoDB insertion failed, including an enqueue timestamp collision. A collision preserves the existing Job and rejects the new Job. An uncertain DynamoDB acknowledgement may still have accepted a complete Job. No application retries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookReply'
  /status:
    get:
      operationId: getStatus
      summary: Read the current job status
      description: 'Return pending, ok, or error. ok requires independent repository verification, a candidate-bound fresh review PASS within three passes, clean workspace, a nonempty committed change descended from the pinned baseline, matching reviewed/local/remote/PR heads, and independently confirmed merged integration into the configured target. Publication does not grant merge permission; an independent worker gate precedes a fresh exact-head merge-commit invocation honoring GitHub protection and required checks, including repositories with no required checks. The fetched merge commit must have two parents, the verified head as second parent, and ancestry in the fetched target. Changed candidates, uncertain outcomes, auto-merge without actual integration, or denied merges fail closed. AI review does not prove correctness or test adequacy. Workflow completion additionally requires confirmed VM termination; cleanup failure keeps queued work blocking.'
      security:
        - MicrovmProxyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyPort'
        - $ref: '#/components/parameters/ConnectionMarker'
      responses:
        '200':
          description: Current job status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
              examples:
                pending:
                  value: {status: pending}
                ok:
                  value: {status: ok}
                error:
                  value: {status: error}
        '400':
          $ref: '#/components/responses/ProxyBadRequest'
        '403':
          $ref: '#/components/responses/ProxyForbidden'
        '429':
          $ref: '#/components/responses/ProxyThrottled'
        '500':
          $ref: '#/components/responses/ProxyInternalFailure'
        '502':
          $ref: '#/components/responses/ProxyUnavailable'
        default:
          $ref: '#/components/responses/RequestFailure'
  /aws/lambda-microvms/runtime/v1/ready:
    servers:
      - url: http://localhost:8080
        description: Internal AWS lifecycle listener.
    post:
      operationId: ready
      summary: Confirm server readiness for image creation
      description: Confirm snapshot readiness without starting a job.
      security: []
      responses:
        '200':
          description: Ready for snapshotting; no body.
        '503':
          $ref: '#/components/responses/HookNotReady'
        default:
          $ref: '#/components/responses/HookFailure'
  /aws/lambda-microvms/runtime/v1/validate:
    servers:
      - url: http://localhost:8080
        description: Internal AWS lifecycle listener.
    post:
      operationId: validate
      summary: Validate the image without credential-dependent operations
      description: Check executables, workspace writes, and process execution without credentials.
      security: []
      responses:
        '200':
          description: Validation passed; no body.
        '503':
          $ref: '#/components/responses/HookNotReady'
        default:
          $ref: '#/components/responses/HookFailure'
  /aws/lambda-microvms/runtime/v1/run:
    servers:
      - url: http://localhost:8080
        description: Internal AWS lifecycle listener.
    post:
      operationId: run
      summary: Initialize one job and start its worker asynchronously
      description: Validate an authorized job and start its worker asynchronously.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunHookRequest'
      responses:
        '200':
          description: Worker started; no body.
        default:
          $ref: '#/components/responses/HookFailure'
  /aws/lambda-microvms/runtime/v1/terminate:
    servers:
      - url: http://localhost:8080
        description: Internal AWS lifecycle listener.
    post:
      operationId: terminate
      summary: Stop the worker process group and flush available logs
      description: Stop the worker process group and flush available logs.
      security: []
      responses:
        '200':
          description: Worker stopped and logs flushed; no body.
        default:
          $ref: '#/components/responses/HookFailure'
components:
  securitySchemes:
    GitHubSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: 'sha256=<lowercase hexadecimal HMAC-SHA256 of original body bytes>, using the deployment signing secret; compared in constant time. Authenticates GitHub delivery, not issue-author authority.'
    MicrovmProxyAuth:
      type: apiKey
      in: header
      name: X-aws-proxy-auth
      description: AWS-validated JWE for this VM and port 8080; expires after 30 minutes.
  parameters:
    ProxyPort:
      name: X-aws-proxy-port
      in: header
      required: true
      description: Worker port authorized by the JWE.
      schema:
        type: string
        const: '8080'
    ConnectionMarker:
      name: X-Poc-Connection
      in: header
      required: false
      description: Optional EventBridge marker; ignored by the worker, not authentication.
      schema:
        type: string
  schemas:
    WebhookReply:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          description: Fixed diagnostic message; no task content, exception details, or credentials.
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, ok, error]
      description: Job status only; no diagnostics or artifacts.
    RunHookRequest:
      type: object
      required: [microvmId, runHookPayload]
      properties:
        microvmId:
          type: string
          minLength: 1
          description: AWS-assigned MicroVM identifier.
        runHookPayload:
          type: string
          contentMediaType: application/json
          contentSchema:
            $ref: '#/components/schemas/Job'
          description: JSON-serialized Job string; maximum 16 KB in UTF-8.
    WorkflowSubmission:
      type: array
      minItems: 1
      maxItems: 1
      items:
        $ref: '#/components/schemas/Job'
      description: Direct Step Functions testing submission. The workflow unwraps one Job for the worker; direct Job objects and other batch sizes are rejected before VM launch. Direct tests have no queue reference and perform no terminal queue writes; the operator prevents overlap with queued Jobs. Dispatcher submissions carry this singleton array in jobs and the stored item's PK/SK separately in queue.
    Job:
      type: object
      additionalProperties: false
      required: [repository, baseSha, task]
      properties:
        repository:
          type: string
          minLength: 1
          description: GitHub repository in owner/name format; must exactly match deployment-supplied AUTHORIZED_REPOSITORY. Missing authorization fails closed.
        baseSha:
          type: string
          minLength: 1
          description: Full pinned baseline commit SHA; checked during checkout.
        task:
          type: string
          minLength: 1
          description: Approved nonblank coding task.
      description: Job input; AUTHORIZED_REPOSITORY and PR_TARGET_BRANCH are deployment-controlled environment settings, not Job fields. No secrets.
  responses:
    HookNotReady:
      description: Not ready; AWS retries until the build-hook timeout. Body unspecified.
    HookFailure:
      description: Lifecycle hook failed; body unspecified.
    ProxyBadRequest:
      description: Malformed request or invalid port header; body unspecified.
    ProxyForbidden:
      description: Missing, expired, invalid, or incorrectly scoped JWE; body unspecified.
    ProxyThrottled:
      description: Ingress rate limit exceeded; body unspecified.
    ProxyInternalFailure:
      description: Internal ingress error; body unspecified.
    ProxyUnavailable:
      description: Worker unavailable through ingress; body unspecified.
    RequestFailure:
      description: Request failed; no valid job status. Body unspecified.
