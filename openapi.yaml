openapi: 3.1.0
info:
  title: Software factory PoC lifecycle and worker interface
  version: 0.1.0
  description: MicroVM lifecycle hooks and job status API.
servers:
  - url: https://{endpoint}
    description: AWS-managed endpoint returned at launch.
    variables:
      endpoint:
        default: microvm-endpoint.example.invalid
paths:
  /status:
    get:
      operationId: getStatus
      summary: Read the current job status
      description: 'Return the current job status: pending, ok, or error.'
      security:
        - MicrovmProxyAuth: []
      parameters:
        - $ref: '#/components/parameters/ProxyPort'
        - $ref: '#/components/parameters/ConnectionMarker'
      responses:
        '200':
          description: Current job status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
              examples:
                pending:
                  value: {status: pending}
                ok:
                  value: {status: ok}
                error:
                  value: {status: error}
        '400':
          $ref: '#/components/responses/ProxyBadRequest'
        '403':
          $ref: '#/components/responses/ProxyForbidden'
        '429':
          $ref: '#/components/responses/ProxyThrottled'
        '500':
          $ref: '#/components/responses/ProxyInternalFailure'
        '502':
          $ref: '#/components/responses/ProxyUnavailable'
        default:
          $ref: '#/components/responses/RequestFailure'
  /aws/lambda-microvms/runtime/v1/ready:
    servers:
      - url: http://localhost:8080
        description: Internal AWS lifecycle listener.
    post:
      operationId: ready
      summary: Confirm server readiness for image creation
      description: Confirm snapshot readiness without starting a job.
      security: []
      responses:
        '200':
          description: Ready for snapshotting; no body.
        '503':
          $ref: '#/components/responses/HookNotReady'
        default:
          $ref: '#/components/responses/HookFailure'
  /aws/lambda-microvms/runtime/v1/validate:
    servers:
      - url: http://localhost:8080
        description: Internal AWS lifecycle listener.
    post:
      operationId: validate
      summary: Validate the image without credential-dependent operations
      description: Check executables, workspace writes, and process execution without credentials.
      security: []
      responses:
        '200':
          description: Validation passed; no body.
        '503':
          $ref: '#/components/responses/HookNotReady'
        default:
          $ref: '#/components/responses/HookFailure'
  /aws/lambda-microvms/runtime/v1/run:
    servers:
      - url: http://localhost:8080
        description: Internal AWS lifecycle listener.
    post:
      operationId: run
      summary: Initialize one job and start its worker asynchronously
      description: Validate an authorized job and start its worker asynchronously.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunHookRequest'
      responses:
        '200':
          description: Worker started; no body.
        default:
          $ref: '#/components/responses/HookFailure'
  /aws/lambda-microvms/runtime/v1/terminate:
    servers:
      - url: http://localhost:8080
        description: Internal AWS lifecycle listener.
    post:
      operationId: terminate
      summary: Stop the worker process group and flush available logs
      description: Stop the worker process group and flush available logs.
      security: []
      responses:
        '200':
          description: Worker stopped and logs flushed; no body.
        default:
          $ref: '#/components/responses/HookFailure'
components:
  securitySchemes:
    MicrovmProxyAuth:
      type: apiKey
      in: header
      name: X-aws-proxy-auth
      description: AWS-validated JWE for this VM and port 8080; expires after 30 minutes.
  parameters:
    ProxyPort:
      name: X-aws-proxy-port
      in: header
      required: true
      description: Worker port authorized by the JWE.
      schema:
        type: string
        const: '8080'
    ConnectionMarker:
      name: X-Poc-Connection
      in: header
      required: false
      description: Optional EventBridge marker; ignored by the worker, not authentication.
      schema:
        type: string
  schemas:
    Status:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, ok, error]
      description: Job status only; no diagnostics or artifacts.
    RunHookRequest:
      type: object
      required: [microvmId, runHookPayload]
      properties:
        microvmId:
          type: string
          minLength: 1
          description: AWS-assigned MicroVM identifier.
        runHookPayload:
          type: string
          contentMediaType: application/json
          contentSchema:
            $ref: '#/components/schemas/Job'
          description: JSON-serialized Job string; maximum 16 KB in UTF-8.
    Job:
      type: object
      additionalProperties: false
      required: [repository, baseSha, task]
      properties:
        repository:
          type: string
          minLength: 1
          description: Configuration-authorized GitHub repository in owner/name format.
        baseSha:
          type: string
          minLength: 1
          description: Full pinned baseline commit SHA; checked during checkout.
        task:
          type: string
          minLength: 1
          description: Approved nonblank coding task.
      description: Job input; authorization and PR target are deployment-controlled. No secrets.
  responses:
    HookNotReady:
      description: Not ready; AWS retries until the build-hook timeout. Body unspecified.
    HookFailure:
      description: Lifecycle hook failed; body unspecified.
    ProxyBadRequest:
      description: Malformed request or invalid port header; body unspecified.
    ProxyForbidden:
      description: Missing, expired, invalid, or incorrectly scoped JWE; body unspecified.
    ProxyThrottled:
      description: Ingress rate limit exceeded; body unspecified.
    ProxyInternalFailure:
      description: Internal ingress error; body unspecified.
    ProxyUnavailable:
      description: Worker unavailable through ingress; body unspecified.
    RequestFailure:
      description: Request failed; no valid job status. Body unspecified.
