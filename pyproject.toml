[project]
name = "software-factory-v3"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["ruff", "coverage", "aws-cdk-lib==2.275.0", "constructs==10.8.1"]

[tool.uv]
package = false

[tool.ruff]
include = ["*.py", "*.pyi"]

[tool.ruff.per-file-target-version]
"worker/*.py" = "py39"
"image/*.py" = "py39"
"tests/*.py" = "py39"

[tool.coverage.run]
branch = true
source = ["tools", "worker", "infra", "image"]

[tool.coverage.report]
show_missing = true
