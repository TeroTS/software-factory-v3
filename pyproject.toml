[project]
name = "software-factory-v3"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["ruff", "coverage"]

[tool.uv]
package = false

[tool.ruff]
include = ["*.py", "*.pyi"]

[tool.coverage.run]
branch = true
source = ["tools"]

[tool.coverage.report]
show_missing = true
