[project]
name = "software-factory-v3"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "boto3==1.43.123",
]

[dependency-groups]
dev = ["ruff", "coverage", "aws-cdk-lib==2.275.0", "constructs==10.8.1"]

[tool.uv]
package = false

[tool.ruff]
include = ["*.py", "*.pyi"]

[tool.ruff.per-file-target-version]
"src/worker/*.py" = "py313"
"src/receiver/*.py" = "py313"
"src/dispatcher/*.py" = "py313"
"image/*.py" = "py313"
"src/tests/*.py" = "py313"

[tool.coverage.run]
branch = true
source = ["src/tools", "src/worker", "src/infra", "image", "src/receiver", "src/dispatcher"]

[tool.coverage.report]
show_missing = true
