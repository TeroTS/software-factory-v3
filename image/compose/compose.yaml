services:
  db:
    image: valkey/valkey:7.2.8-alpine
    command: [valkey-server, --appendonly, "yes"]
    volumes:
      - data:/data
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 1s
      timeout: 3s
      retries: 60
  http:
    build: .
    ports:
      - "127.0.0.1:18080:8000"
    volumes:
      - .:/work
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/from-container', timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 60
volumes:
  data:
